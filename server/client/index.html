<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JodJodKUB — เข้าสู่ระบบ</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <div class="logo">
        <div class="brand-mark">฿</div>
        <h1>JodJodKUB</h1>
        <p>จดรายรับรายจ่าย อ่านสลิปอัตโนมัติ</p>
      </div>

      <!-- ฟอร์มเข้าสู่ระบบ -->
      <form class="card" id="loginForm">
        <h2 style="margin-bottom:18px">เข้าสู่ระบบ</h2>
        <div class="field">
          <label for="loginEmail">อีเมล</label>
          <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="loginPassword">รหัสผ่าน</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn" type="submit">เข้าสู่ระบบ</button>
        <div class="msg" id="loginMsg"></div>
        <div class="switch">ยังไม่มีบัญชี? <a id="toRegister">สมัครสมาชิก</a></div>
      </form>

      <!-- ฟอร์มสมัครสมาชิก -->
      <form class="card hide" id="registerForm">
        <h2 style="margin-bottom:18px">สมัครสมาชิก</h2>
        <div class="field">
          <label for="regName">ชื่อที่จะแสดง</label>
          <input id="regName" placeholder="เช่น สมชาย" required />
        </div>
        <div class="field">
          <label for="regEmail">อีเมล</label>
          <input id="regEmail" type="email" autocomplete="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="regPassword">รหัสผ่าน</label>
          <input id="regPassword" type="password" autocomplete="new-password" minlength="8" placeholder="อย่างน้อย 8 ตัวอักษร" required />
        </div>
        <button class="btn" type="submit">สมัครสมาชิก</button>
        <div class="msg" id="registerMsg"></div>
        <div class="switch">มีบัญชีอยู่แล้ว? <a id="toLogin">เข้าสู่ระบบ</a></div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
